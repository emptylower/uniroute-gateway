name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'
      # Advisory only: new advisories land upstream on their own schedule and must not block merges.
      - name: Run govulncheck
        id: govulncheck
        continue-on-error: true
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Report govulncheck findings
        if: steps.govulncheck.outcome == 'failure'
        run: |
          echo "::warning title=govulncheck::Vulnerabilities reported (advisory, not blocking). See the 'Run govulncheck' step log."
          echo "### govulncheck reported vulnerabilities (advisory)" >> "$GITHUB_STEP_SUMMARY"
          echo "Not blocking. Open the 'Run govulncheck' step for details; most are fixed by a Go patch release." >> "$GITHUB_STEP_SUMMARY"

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
      # Advisory only, same as govulncheck above.
      - name: Check audit exceptions
        id: audit-exceptions
        continue-on-error: true
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
      - name: Report audit findings
        if: steps.audit-exceptions.outcome == 'failure'
        run: |
          echo "::warning title=pnpm audit::High/critical advisories without a valid exception (advisory, not blocking). See the 'Check audit exceptions' step log."
          echo "### pnpm audit: advisories without a valid exception (advisory)" >> "$GITHUB_STEP_SUMMARY"
          echo "Not blocking. Upgrade the package, or add a dated entry to .github/audit-exceptions.yml." >> "$GITHUB_STEP_SUMMARY"
